<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070C0A" />
    <title>Derek Zabaleta — Full Stack Developer .NET & React</title>
    <meta
      name="description"
      content="Portafolio de Derek Zabaleta, desarrollador Full Stack .NET y React en Medellín, Colombia."
    />

    <!-- Canonical + hreflang: single-URL SPA — the same document serves
         both locales client-side (see LanguageProvider), so all variants
         point at the same URL. VITE_SITE_URL is a build-time env var
         (see README → Deploy) resolved by Vite's HTML env replacement. -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <link rel="alternate" hreflang="es" href="%VITE_SITE_URL%/" />
    <link rel="alternate" hreflang="en" href="%VITE_SITE_URL%/" />
    <link rel="alternate" hreflang="x-default" href="%VITE_SITE_URL%/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Derek Zabaleta — Full Stack Developer .NET & React" />
    <meta
      property="og:description"
      content="Portafolio de Derek Zabaleta, desarrollador Full Stack .NET y React en Medellín, Colombia."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Derek Zabaleta — Full Stack Developer .NET & React" />
    <meta
      name="twitter:description"
      content="Portafolio de Derek Zabaleta, desarrollador Full Stack .NET y React en Medellín, Colombia."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Derek Zabaleta",
        "jobTitle": "Full Stack Developer — .NET & React",
        "url": "%VITE_SITE_URL%/",
        "sameAs": ["https://github.com/DerekDraimon", "https://linkedin.com/in/davz-dev"],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Medellín",
          "addressCountry": "CO"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
